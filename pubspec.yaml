name: flutter_base_kit
description: "A comprehensive Flutter development kit with base classes, utilities, and common patterns for faster app development."
version: 1.3.17

homepage: https://okladnoj-bio.web.app/
repository: https://github.com/Okladnoj/flutter_base_kit
issue_tracker: https://github.com/Okladnoj/flutter_base_kit/issues
funding:
  - https://donate-okji.web.app/

screenshots:
  - description: "flutter base kit"
    path: ass/flutter_base_kit-logo.png

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  json_annotation: ^4.12.0
  logger: ^2.8.0
  freezed_annotation: ^3.1.0
  dio: ^5.11.1
  provider: ^6.1.5+1
  path: ^1.9.1
  args: ^2.7.0
  json_serializable: ^6.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1

dependency_overrides:
  build: ^5.0.0

flutter:
  uses-material-design: true
keywords:
  - flutter
  - template
  - boilerplate

topics:
  - search
  - template
  - boilerplate
  - routing
  - dependency-injection

executables:
  flutter_base_kit: flutter_base_kit
  fbkit: flutter_base_kit

license: MIT
