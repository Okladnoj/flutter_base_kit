name: base_kit_package_example
description: "Demonstrates how to use the base_kit_package plugin."
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  base_kit_package:
    path: ../
  cupertino_icons: ^2.0.0
  universal_io: ^2.3.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true