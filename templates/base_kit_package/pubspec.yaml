name: base_kit_package
description: "A new Flutter plugin project."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  auto_route: ^11.2.0
  dio: ^5.11.1
  retrofit: ^4.10.0
  pretty_dio_logger: ^1.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.4
  lottie: ^3.6.1
  logger: ^2.8.0
  path: ^1.9.1
  collection: ^1.19.1
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  flutter_base_kit: ^1.3.15
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  permission_handler: ^13.0.2
  crypto: ^3.0.7
  path_provider: ^2.1.6
  universal_io: ^2.3.1
  freezed: ^4.0.1
  web: ^1.1.1
  share_plus: ^13.3.1
  cross_file: ^0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.12
  flutter_gen_runner: ^5.15.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_gen:
  output: lib/src/gen
  assets:
    outputs:
      package_parameter_enabled: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/lottie/
    - assets/icons/
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/nunito/Nunito-ExtraLight.ttf
          weight: 100 # Thin
        - asset: fonts/nunito/Nunito-ExtraLight.ttf
          weight: 200 # ExtraLight
        - asset: fonts/nunito/Nunito-Light.ttf
          weight: 300 # Light
        - asset: fonts/nunito/Nunito-Regular.ttf
          weight: 400 # Regular
        - asset: fonts/nunito/Nunito-Medium.ttf
          weight: 500 # Medium
        - asset: fonts/nunito/Nunito-SemiBold.ttf
          weight: 600 # SemiBold
        - asset: fonts/nunito/Nunito-Bold.ttf
          weight: 700 # Bold
        - asset: fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800 # ExtraBold
        - asset: fonts/nunito/Nunito-Black.ttf
          weight: 900 # Black
